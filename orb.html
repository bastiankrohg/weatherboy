<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weatherboy · VHF</title>
<style>
  /* A phosphor screen in a radio: the sphere is drawn like an oscilloscope trace, the mode is a station on
     the dial. Colour is the phosphor of the mode, set on <body> by the script. */
  :root { --ph: 255 157 46; --bg: #0c0a08; --panel: #15120e; --line: #2c261f; --muted: #7d7263; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: rgb(var(--ph)); overflow: hidden; display: grid; grid-template-rows: auto 1fr auto;
         font: 14px/1.4 "SF Mono", Menlo, "DejaVu Sans Mono", Consolas, monospace; letter-spacing: .04em; }
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 9;
                background: repeating-linear-gradient(rgb(0 0 0 / .28) 0 1px, transparent 1px 3px),
                            radial-gradient(ellipse at center, transparent 55%, rgb(0 0 0 / .65) 100%);
                animation: flicker 4s steps(40) infinite; }
  @keyframes flicker { 0%, 100% { opacity: 1; } 47% { opacity: .93; } 48% { opacity: 1; } 81% { opacity: .96; } }
  @media (prefers-reduced-motion: reduce) { body::after { animation: none; } }
  .glow { text-shadow: 0 0 6px rgb(var(--ph) / .7), 0 0 18px rgb(var(--ph) / .35); }
  header { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 20px 0; }
  .brand { font-weight: 700; letter-spacing: .32em; }
  .brand small { color: var(--muted); font-weight: 400; letter-spacing: .18em; margin-left: 10px; }
  .meta { color: var(--muted); display: flex; gap: 16px; }
  .rec::before { content: "●"; margin-right: 6px; color: rgb(var(--ph)); }
  .rec.off::before { content: "○"; color: var(--muted); }
  #stage { position: relative; min-height: 0; }
  #orb { position: absolute; inset: 0; width: 100%; height: 100%; }
  .mode { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; }
  .mode b { display: block; font-size: 30px; letter-spacing: .42em; padding-left: .42em; }
  .mode span { color: var(--muted); font-size: 13px; }
  .panel { background: linear-gradient(#1a1611, var(--panel)); border-top: 1px solid var(--line);
           padding: 14px 20px 18px; display: grid; gap: 12px; }
  .dial { position: relative; height: 54px; border: 1px solid var(--line); border-radius: 4px; overflow: hidden;
          background: linear-gradient(rgb(var(--ph) / .06), transparent 70%), #0e0c09; }
  .ticks { position: absolute; left: 2%; right: 2%; bottom: 0; height: 14px;
           background: repeating-linear-gradient(90deg, var(--muted) 0 1px, transparent 1px calc(100% / 80)); opacity: .55; }
  .ticks.big { height: 22px; background: repeating-linear-gradient(90deg, var(--muted) 0 1px, transparent 1px calc(100% / 10));
               opacity: .9; }
  .num, .stn { position: absolute; transform: translateX(-50%); font-size: 11px; }
  .num { bottom: 24px; color: var(--muted); }
  .stn { top: 5px; font-size: 10px; letter-spacing: .2em; color: var(--muted); }
  .stn.on { color: rgb(var(--ph)); }
  .needle { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #ff4a2a;
            box-shadow: 0 0 8px #ff4a2a, 0 0 2px #fff; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; }
  #scope { width: 100%; height: 56px; display: block; border: 1px solid var(--line); border-radius: 4px; background: #0e0c09; }
  .vu { display: grid; grid-template-columns: repeat(24, 7px); gap: 3px; height: 22px; }
  .vu i { background: #241f19; border-radius: 1px; }
  .vu i.on { background: rgb(var(--ph)); box-shadow: 0 0 6px rgb(var(--ph) / .8); }
  .vu i.hot.on { background: #ffcc33; box-shadow: 0 0 6px #ffcc33; }
  .vu i.red.on { background: #ff4a2a; box-shadow: 0 0 6px #ff4a2a; }
  .read { color: var(--muted); font-size: 12px; text-align: right; margin-top: 4px; }
  .read b { color: rgb(var(--ph)); font-weight: 400; }
  /* the transcript: newest at the bottom, older lines scroll up and out of sight */
  .text { height: 9.6em; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; scrollbar-width: none; }
  .text::-webkit-scrollbar { display: none; }
  .text > div { display: grid; grid-template-columns: 3.4em 1fr; gap: 8px; }
  .text time { color: var(--muted); font-size: 11px; padding-top: 2px; }
  .text .du { color: var(--muted); }
  .text .du span::before { content: "› "; }
  .text .rule { color: var(--muted); opacity: .7; }
  .text .sys { color: var(--muted); opacity: .6; font-size: 11px; }
  .text .rule span { font-size: 11px; letter-spacing: .3em; }
  .text .typing span::after { content: "▌"; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  /* short (inside the page's chat section): the orb and the transcript, without the scope and the meter */
  @media (max-height: 640px) {
    .row { display: none; }
    .panel { gap: 8px; padding-top: 10px; padding-bottom: 12px; }
    .text { height: 6.6em; }
    .mode b { font-size: 22px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand glow">WEATHERBOY<small>VHF · F615</small></div>
  <div class="meta"><span id="clock">--:--:--</span><span class="rec off" id="rec">INGEN SIGNAL</span></div>
</header>
<div id="stage">
  <canvas id="orb"></canvas>
  <div class="mode"><b class="glow" id="mode">LAGT PÅ</b><span id="label"></span></div>
</div>
<div class="panel">
  <div class="dial" id="dial">
    <div class="ticks"></div><div class="ticks big"></div>
    <div class="needle" id="needle"></div>
  </div>
  <div class="row">
    <canvas id="scope"></canvas>
    <div><div class="vu" id="vu"></div><div class="read"><b id="freq">88.6</b> MHz · <b id="db">-∞</b> dB</div></div>
  </div>
  <div class="text glow" id="log" aria-live="polite"></div>
</div>
<script>
// Each mode is a station on the dial and a phosphor colour. "off" is the stream gone: static, no station.
const MODES = {
  idle:   {name: "LAGT PÅ", mhz: 88.6,  rgb: [255, 157, 46],  spin: .05, amp: .015, rings: 12},
  listen: {name: "LYTTER",  mhz: 93.4,  rgb: [125, 255, 176], spin: .15, amp: .03,  rings: 18},
  hear:   {name: "HØRER",   mhz: 96.2,  rgb: [196, 150, 255], spin: .2,  amp: .035, rings: 18},
  think:  {name: "TENKER",  mhz: 99.1,  rgb: [111, 211, 255], spin: .9,  amp: .03,  rings: 18},
  speak:  {name: "SNAKKER", mhz: 104.7, rgb: [255, 179, 71],  spin: .25, amp: .03,  rings: 18},
  error:  {name: "FEIL",    mhz: 107.4, rgb: [255, 84, 64],   spin: .4,  amp: .06,  rings: 14},
};
const STILL = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = id => document.getElementById(id);
const pct = mhz => 2 + (mhz - 88) / 20 * 96;  // the scale runs 88-108 between 2% and 98% of the dial

for (let f = 88; f <= 108; f += 4) $("dial").insertAdjacentHTML("beforeend", `<span class="num" style="left:${pct(f)}%">${f}</span>`);
for (const [k, m] of Object.entries(MODES))
  $("dial").insertAdjacentHTML("beforeend", `<span class="stn" data-mode="${k}" style="left:${pct(m.mhz)}%">${m.name}</span>`);
$("vu").innerHTML = Array.from({length: 24}, (_, i) => `<i class="${i >= 21 ? "red" : i >= 16 ? "hot" : ""}"></i>`).join("");
const leds = [...$("vu").children];

let S = {mode: "idle", level: 0, label: "", heard: "", said: ""}, lastMsg = -1e9;
const es = new EventSource("/api/orb");
es.onmessage = e => { S = JSON.parse(e.data); lastMsg = performance.now(); };

// static: a few frames of noise, drawn stretched over everything at a strength that depends on the mode
const noise = Array.from({length: 4}, () => {
  const c = document.createElement("canvas"); c.width = c.height = 160;
  const g = c.getContext("2d"), img = g.createImageData(160, 160);
  for (let i = 0; i < img.data.length; i += 4) { const v = Math.random() * 255; img.data.set([v, v, v, 255], i); }
  g.putImageData(img, 0, 0); return c;
});

const cv = $("orb"), ctx = cv.getContext("2d"), sc = $("scope"), sx = sc.getContext("2d");
let W, H, dpr;
function fit() {
  dpr = devicePixelRatio || 1;
  W = cv.width = cv.clientWidth * dpr; H = cv.height = cv.clientHeight * dpr;
  sc.width = sc.clientWidth * dpr; sc.height = sc.clientHeight * dpr;
}
addEventListener("resize", fit); fit();

let lv = 0, rot = 0, spikes = 0, mhz = 88.6, col = [255, 157, 46], waves = [], lastWave = 0, prevLv = 0, t0 = performance.now(), prev = t0;
const hist = new Array(160).fill(0);
let typing = null, shown = "", seq = -1, fetching = false;

// The transcript, fetched when the stream says it moved on. The newest answer is typed out like a teleprinter.
async function loadLog(want) {
  if (fetching) return;
  fetching = true;
  try {
    const lines = await (await fetch("/api/orb/log")).json();
    const box = $("log"), stuck = box.scrollHeight - box.scrollTop - box.clientHeight < 8;
    box.innerHTML = "";
    if (!lines.length) box.innerHTML = '<div class="rule"><time></time><span>Ingen samtale ennå: løft røret og si noe</span></div>';
    lines.forEach((l, i) => {
      const row = document.createElement("div");
      row.className = l.who === "-" ? "rule" : l.who;
      row.innerHTML = "<time></time><span></span>";
      row.querySelector("time").textContent = l.at;
      row.querySelector("span").textContent = l.who === "-" ? `— ${l.text} —` : l.text;
      box.append(row);
      if (i === lines.length - 1 && l.who === "weatherboy" && seq !== -1) {  // new since the page opened: type it
        typing = { el: row, text: l.text };
        shown = "";
        row.classList.add("typing");
      }
    });
    if (stuck || seq === -1) box.scrollTop = box.scrollHeight;
    seq = want;
  } catch {}
  fetching = false;
}

// The eyes: two voids in the drop whose shape says how it feels. Each mood is a target the shape eases toward,
// so it changes like something alive: rx/ry are the size (in R), tilt slants them (angry/worried), look moves
// them, arc turns them into happy ^ ^ arcs. And now and then a blink.
const MOODS = {
  idle:   {rx: .11, ry: .014, tilt: 0,    lookX: 0,   lookY: .04,  arc: 0},  // asleep on the cradle
  listen: {rx: .095, ry: .115, tilt: 0,   lookX: 0,   lookY: 0,    arc: 0},  // awake, attentive
  hear:   {rx: .12, ry: .15, tilt: 0,     lookX: 0,   lookY: -.01, arc: 0},  // wide: it's taking you in
  think:  {rx: .11, ry: .055, tilt: .22,  lookX: .06, lookY: -.09, arc: 0},  // narrowed, glancing up
  speak:  {rx: .1,  ry: .07, tilt: 0,     lookX: 0,   lookY: 0,    arc: 1},  // pleased ^ ^
  error:  {rx: .1,  ry: .075, tilt: -.38, lookX: 0,   lookY: .02,  arc: 0},  // cross
  off:    {rx: .1,  ry: .012, tilt: 0,    lookX: 0,   lookY: .05,  arc: 0},
};
const eye = {...MOODS.idle};
let nextBlink = 3, blinkT = -1;
function drawEyes(cx, cy, R, dt, t, online) {
  const want = online ? (MOODS[S.mode] || MOODS.idle) : MOODS.off;
  for (const k in eye) eye[k] += (want[k] - eye[k]) * Math.min(1, dt * 7);
  if (S.mode === "hear" && online) eye.ry += (want.ry + lv * .05 - eye.ry) * .3;  // a little wider when you're loud
  let lid = 1;  // a blink: down and up in 0.16 s, every few seconds while awake
  if (t > nextBlink && want.ry > .05) { blinkT = t; nextBlink = t + 2.5 + Math.random() * 4; }
  if (blinkT >= 0 && t - blinkT < .16) lid = Math.abs((t - blinkT) / .08 - 1);
  ctx.save();
  ctx.globalCompositeOperation = "source-over";
  for (const side of [-1, 1]) {
    const x = cx + side * R * .3 + eye.lookX * R, y = cy - R * .1 + eye.lookY * R;
    const rx = eye.rx * R, ry = Math.max(R * .012, eye.ry * R * lid);
    if (eye.arc > .5) {  // happy: an arc bowed upward, a void with soft ends
      ctx.beginPath();
      ctx.ellipse(x, y + ry * .6, rx, Math.max(ry, R * .05), 0, Math.PI * 1.08, Math.PI * 1.92);
      ctx.lineWidth = R * .045; ctx.lineCap = "round"; ctx.strokeStyle = "rgb(6 4 3 / .9)"; ctx.stroke();
      continue;
    }
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, side * eye.tilt, 0, 2 * Math.PI);
    ctx.fillStyle = "rgb(6 4 3 / .92)"; ctx.fill();  // the void
    ctx.lineWidth = Math.max(1, R * .008);  // its edge catches a little of the light inside the drop
    ctx.strokeStyle = `rgb(${col.map(Math.round).join(" ")} / .35)`; ctx.stroke();
  }
  ctx.restore();
}

// The weather, around and over the orb: drifting clouds, rain or snow falling, wind streaking across
const WX_RGB = { sun: [255, 196, 70], clouds: [200, 205, 218], rain: [100, 160, 255], snow: [235, 242, 255] };
function cloudShape(x, y, s, a) {
  ctx.fillStyle = `rgb(205 210 222 / ${a})`;
  ctx.beginPath();
  for (const [dx, dy, r] of [[-0.9, 0.2, .55], [-0.2, -0.25, .75], [.6, .15, .5], [0, .35, .6]])
    ctx.moveTo(x + dx * s + r * s, y + dy * s), ctx.arc(x + dx * s, y + dy * s, r * s, 0, 2 * Math.PI);
  ctx.fill();
}
function weatherScene(wx, t) {
  ctx.save();
  ctx.globalCompositeOperation = "source-over";
  if (wx.scene !== "sun") {  // a sky full of clouds; with rain or snow too, heavier
    const many = wx.scene === "clouds" ? 7 : 5;
    for (let i = 0; i < many; i++) {
      const s = (60 + (i * 37) % 50) * dpr, x = ((i * 241 + t * (10 + i * 3) * dpr) % (W + 4 * s)) - 2 * s;
      cloudShape(x, (60 + (i * 97) % (H * .45 / dpr)) * dpr, s, wx.scene === "clouds" ? .55 : .4);
    }
  }
  if (wx.scene === "rain") {
    ctx.strokeStyle = "rgb(140 185 255 / .75)"; ctx.lineWidth = 1.5 * dpr; ctx.beginPath();
    for (let i = 0; i < 110; i++) {
      const x = (i * 131) % W, y = ((i * 73 + t * 520 * dpr) % (H + 40 * dpr)) - 20 * dpr;
      ctx.moveTo(x, y); ctx.lineTo(x - 6 * dpr, y + 20 * dpr);
    }
    ctx.stroke();
  }
  if (wx.scene === "snow") {
    ctx.fillStyle = "rgb(255 255 255 / .85)";
    for (let i = 0; i < 80; i++) {
      const x = ((i * 131) % W) + Math.sin(t + i) * 12 * dpr, y = ((i * 73 + t * 70 * dpr) % (H + 20 * dpr)) - 10 * dpr;
      ctx.beginPath(); ctx.arc(x, y, (2 + i % 2) * dpr, 0, 2 * Math.PI); ctx.fill();
    }
  }
  if (wx.windy) {  // strong wind: streaks blowing across, fast
    ctx.strokeStyle = "rgb(235 240 250 / .6)"; ctx.lineWidth = 2 * dpr; ctx.beginPath();
    for (let i = 0; i < 18; i++) {
      const len = (60 + (i * 41) % 90) * dpr, x = ((i * 157 + t * (700 + i * 30) * dpr) % (W + len)) - len;
      const y = (40 + (i * 83) % (H / dpr - 80)) * dpr;
      ctx.moveTo(x, y); ctx.lineTo(x + len, y); ctx.moveTo(x + len * .3, y + 5 * dpr); ctx.lineTo(x + len * .8, y + 5 * dpr);
    }
    ctx.stroke();
  }
  ctx.restore();
}

function frame(now) {
  const dt = Math.min(.05, (now - prev) / 1000), t = (now - t0) / 1000; prev = now;
  const online = now - lastMsg < 1500;
  const m = online ? (MODES[S.mode] || MODES.idle) : MODES.idle;
  const target = online ? S.level : 0;
  lv += (target - lv) * (target > lv ? .5 : .12);
  const wx = online ? S.weather : null;  // the weather, for half a minute after it was asked for
  const wxRgb = wx ? WX_RGB[wx.scene] || m.rgb : m.rgb;
  col = col.map((c, i) => c + (wxRgb[i] - c) * .06);
  const rgb = col.map(Math.round).join(" ");
  document.body.style.setProperty("--ph", rgb);

  // the orb: a heavy, glossy drop of phosphor, like ferrofluid. Its outline is a radius per angle: a slow
  // wobble that never stops, and while it listens, spikes that stand up with the sound and lie down again.
  ctx.globalCompositeOperation = "source-over";
  if (wx && wx.scene === "sun") {  // a sunny day: a blue sky behind it, and the orb is the sun
    const skyG = ctx.createLinearGradient(0, 0, 0, H);
    skyG.addColorStop(0, "rgb(24 84 170 / .8)"); skyG.addColorStop(1, "rgb(96 160 225 / .8)");
    ctx.fillStyle = skyG;
  } else ctx.fillStyle = "rgb(12 10 8 / .8)";
  ctx.fillRect(0, 0, W, H);  // a short phosphor tail, not a smear
  const speakLv = S.mode === "speak" && online ? lv : 0;
  const R = Math.min(W, H) * .27 * (1 + speakLv * .07),
        cx = W / 2 + (S.mode === "error" && online ? (Math.random() - .5) * 10 * dpr : 0), cy = H / 2 - 18 * dpr;
  rot += m.spin * (STILL ? .2 : 1) * dt;
  const wantSpikes = online && (S.mode === "listen" || S.mode === "hear") ? Math.min(1, .18 + lv * 1.15) : 0;
  spikes += (wantSpikes - spikes) * (wantSpikes > spikes ? .25 : .06);  // they rise fast and settle slowly
  const amp = (online ? m.amp * .8 : .01) + speakLv * .06, breathe = .015 * Math.sin(t * 1.3);
  const K = 26, width = .11 + .02 * spikes, path = new Path2D();
  for (let j = 0; j <= 540; j++) {
    const th = 2 * Math.PI * j / 540;
    let r = R * (1 + breathe + amp * (Math.sin(3 * th + t * .9) * .55 + Math.sin(5 * th - t * .7) * .3
                                     + Math.sin(2 * th + t * .5) * .15));
    if (spikes > .01) {
      let tip = 0;
      for (let k = 0; k < K; k++) {
        const at = 2 * Math.PI * k / K + .15 * Math.sin(t * .4 + k);
        const d = Math.abs(((th - at + 3 * Math.PI) % (2 * Math.PI)) - Math.PI);
        if (d < width) tip = Math.max(tip, (.55 + .45 * (.5 + .5 * Math.sin(k * 2.39 + t * 1.7))) * (1 - d / width) ** 2.1);
      }
      r += R * .5 * spikes * tip;
    }
    const x = cx + r * Math.cos(th), y = cy + r * Math.sin(th);
    j ? path.lineTo(x, y) : path.moveTo(x, y);
  }
  path.closePath();
  const tint = (f, a = 1) => `rgb(${col.map(c => Math.round(c * f)).join(" ")} / ${a})`;
  const glow = online ? .5 + lv * .5 : .2;

  ctx.globalCompositeOperation = "lighter";  // the halo around it
  ctx.shadowBlur = (28 + lv * 30) * dpr; ctx.shadowColor = tint(1, .55 * glow);
  ctx.fillStyle = tint(.25, .5 * glow); ctx.fill(path); ctx.shadowBlur = 0;

  ctx.globalCompositeOperation = "source-over";  // the body: dark and heavy, lit from the upper left
  const body = ctx.createRadialGradient(cx - R * .35, cy - R * .4, R * .05, cx, cy, R * 1.35);
  body.addColorStop(0, tint(.68 * (.6 + .4 * glow))); body.addColorStop(.45, tint(.24)); body.addColorStop(1, tint(.05));
  ctx.fillStyle = body; ctx.fill(path);

  ctx.save(); ctx.clip(path); ctx.globalCompositeOperation = "lighter";
  const rim = ctx.createRadialGradient(cx, cy, R * .72, cx, cy, R * 1.3);  // light caught at the edge and the tips
  rim.addColorStop(0, tint(1, 0)); rim.addColorStop(.35, tint(1, .22 * glow)); rim.addColorStop(1, tint(1, .7 * glow));
  ctx.fillStyle = rim; ctx.fillRect(cx - R * 1.8, cy - R * 1.8, R * 3.6, R * 3.6);
  if (S.mode === "think" && online) {  // thinking: soft lights drifting inside it, nothing going round outside
    for (let k = 0; k < 3; k++) {
      const a = rot * 1.3 + k * 2.1, gx = cx + Math.cos(a) * R * .42, gy = cy + Math.sin(a * 1.3) * R * .3;
      const g = ctx.createRadialGradient(gx, gy, 0, gx, gy, R * .45);
      g.addColorStop(0, tint(1, .42)); g.addColorStop(1, tint(1, 0));
      ctx.fillStyle = g; ctx.fillRect(gx - R * .5, gy - R * .5, R, R);
    }
  }
  drawEyes(cx, cy + R * breathe * 2, R, dt, t, online);
  const hx = cx - R * .38, hy = cy - R * .42;  // the gloss: a soft highlight with a sharp core
  const shine = ctx.createRadialGradient(hx, hy, 0, hx, hy, R * .34);
  shine.addColorStop(0, `rgb(255 255 255 / ${online ? .45 : .15})`); shine.addColorStop(.25, `rgb(255 255 255 / ${online ? .14 : .05})`);
  shine.addColorStop(1, "rgb(255 255 255 / 0)");
  ctx.fillStyle = shine; ctx.beginPath(); ctx.ellipse(hx, hy, R * .34, R * .22, -.6, 0, 2 * Math.PI); ctx.fill();
  ctx.restore();

  if (speakLv && lv - prevLv > .06 && t - lastWave > .14) { waves.push({r: R * 1.05, a: .45 * lv + .15}); lastWave = t; }
  prevLv = lv;
  ctx.globalCompositeOperation = "lighter";
  waves = waves.filter(w => (w.r += 140 * dpr * dt, w.a -= .6 * dt) > 0);  // soft ripples while it talks
  for (const w of waves) {
    ctx.beginPath(); ctx.arc(cx, cy, w.r, 0, 2 * Math.PI);
    ctx.strokeStyle = tint(1, w.a * .6); ctx.lineWidth = 2 * dpr; ctx.shadowBlur = 10 * dpr; ctx.shadowColor = tint(1, w.a);
    ctx.stroke();
  }
  ctx.shadowBlur = 0;
  if (wx) weatherScene(wx, t);

  // static and the hum bar rolling down the screen
  ctx.globalCompositeOperation = "source-over";
  ctx.imageSmoothingEnabled = false;
  ctx.globalAlpha = !online ? .5 : S.mode === "think" ? .07 : S.mode === "error" ? .14 : .035;
  ctx.drawImage(noise[Math.floor(Math.random() * 4)], Math.random() * -40, Math.random() * -40, W / 2 + 40, H / 2 + 40);
  ctx.drawImage(noise[Math.floor(Math.random() * 4)], W / 2 - Math.random() * 40, Math.random() * -40, W / 2 + 40, H / 2 + 40);
  ctx.drawImage(noise[Math.floor(Math.random() * 4)], Math.random() * -40, H / 2 - Math.random() * 40, W / 2 + 40, H / 2 + 40);
  ctx.drawImage(noise[Math.floor(Math.random() * 4)], W / 2 - Math.random() * 40, H / 2 - Math.random() * 40, W / 2 + 40, H / 2 + 40);
  ctx.globalAlpha = 1;
  const bar = (t * .08 % 1.4 - .2) * H, hum = ctx.createLinearGradient(0, bar - 60 * dpr, 0, bar + 60 * dpr);
  hum.addColorStop(0, "rgb(255 255 255 / 0)"); hum.addColorStop(.5, "rgb(255 255 255 / .025)"); hum.addColorStop(1, "rgb(255 255 255 / 0)");
  ctx.fillStyle = hum; ctx.fillRect(0, bar - 60 * dpr, W, 120 * dpr);

  // the dial: the needle swings to the mode's station; thinking, it hunts around it like someone tuning
  const want = !online ? 88 + 20 * (.5 + .5 * Math.sin(t * .7)) : m.mhz + (S.mode === "think" ? Math.sin(t * 1.3) * .9 + Math.sin(t * 3.1) * .3 : 0);
  mhz += (want - mhz) * .07;
  $("needle").style.left = pct(mhz) + "%";
  $("freq").textContent = mhz.toFixed(1);
  document.querySelectorAll(".stn").forEach(s => s.classList.toggle("on", online && s.dataset.mode === S.mode));

  // scope and VU meter
  hist.push(lv); hist.shift();
  const sw = sc.width, sh = sc.height;
  sx.fillStyle = "rgb(14 12 9 / .6)"; sx.fillRect(0, 0, sw, sh);
  sx.strokeStyle = "rgb(125 114 99 / .18)"; sx.lineWidth = 1;
  sx.beginPath(); for (let x = 0; x < sw; x += sw / 10) { sx.moveTo(x, 0); sx.lineTo(x, sh); } sx.moveTo(0, sh / 2); sx.lineTo(sw, sh / 2); sx.stroke();
  sx.beginPath();
  for (let x = 0; x <= sw; x += 2) {
    const h = hist[Math.floor(x / sw * (hist.length - 1))];
    const y = sh / 2 + (Math.sin(x * .09 / dpr + t * 14) * h * .42 + Math.sin(x * .023 / dpr - t * 3) * h * .12) * sh
              + (online ? 0 : (Math.random() - .5) * sh * .5);
    x ? sx.lineTo(x, y) : sx.moveTo(x, y);
  }
  sx.strokeStyle = `rgb(${rgb})`; sx.lineWidth = 1.5 * dpr; sx.shadowBlur = 6 * dpr; sx.shadowColor = `rgb(${rgb})`; sx.stroke(); sx.shadowBlur = 0;
  const lit = Math.round(lv * leds.length);
  leds.forEach((l, i) => l.classList.toggle("on", i < lit));
  $("db").textContent = lv > .01 ? Math.round(lv * 40 - 50) : "-∞";

  // words: what was heard, and the answer typed out like a teleprinter
  $("mode").textContent = online ? m.name : "INGEN SIGNAL";
  $("label").textContent = online ? S.label : "venter på main.py";
  $("rec").textContent = online ? "PÅ LUFTA" : "INGEN SIGNAL"; $("rec").classList.toggle("off", !online);
  if (online && S.seq !== undefined && S.seq !== seq) loadLog(S.seq);
  if (typing && shown.length < typing.text.length) {
    shown = typing.text.slice(0, shown.length + Math.max(1, Math.round(dt * 60)));
    typing.el.querySelector("span").textContent = shown;
    $("log").scrollTop = $("log").scrollHeight;
  } else if (typing) { typing.el.classList.remove("typing"); typing = null; }
  $("clock").textContent = new Date().toLocaleTimeString("no-NO");
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
