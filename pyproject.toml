[project]
name = "weatherboy"
version = "1.0.0"
description = "Speak into an old phone handset, get a thermal receipt: Claude, weather, trams, recipes and photos."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.9",
    # the last faster-whisper engine with wheels for Intel Macs older than macOS 11 (the 2012 MacBook Pro)
    "ctranslate2==4.3.1 ; platform_machine == 'x86_64' and sys_platform == 'darwin'",
    "faster-whisper>=1.2.1",
    "pillow>=12.3.0",
    "piper-tts>=1.8.0",
    "qrcode>=8.2",
    "requests>=2.34.2",
    "sounddevice>=0.5.6",
]
