[project]
name = "weatherboy"
version = "1.1.0"
description = "Speak into an old phone handset, get a thermal receipt: Claude or a local model, weather, trams, recipes and photos."
requires-python = ">=3.10"
# The server (web.py): printing, the web page, the tunnel, Claude or a local model. Installs anywhere,
# including a 2012 MacBook Pro on macOS 10.15.
dependencies = [
    "anthropic>=1.9",
    "pillow>=12.3.0",
    "qrcode>=8.2",
    "requests>=2.34.2",
]

[project.optional-dependencies]
# The ESP8266 phone base over the USB cable (`uv sync --extra phone`). Only needed if you plug the handset base
# into this machine; without it phone.py falls back to the UDP link the ESP32 used.
phone = [
    "pyserial>=3.5",
]
# The handset (main.py): speech in and out. `uv sync --extra voice`. PyAV needs macOS 11+; on Intel Macs onnxruntime
# (Piper, Whisper's VAD) is held at 1.19, the last with Intel builds for macOS 11 (below).
voice = [
    "faster-whisper>=1.2.1",
    "piper-tts>=1.8.0",
    "sounddevice>=0.5.6",
    "numpy",
    # Intel Macs: onnxruntime's newer Intel builds need macOS 13, and the old MacBook runs 11
    "onnxruntime<1.20; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
# The browser tests (test_web_ui.py): drives the page in a real Chromium. `uv run playwright install chromium`
# once, then `uv run test_web_ui.py`.
ui = [
    "playwright>=1.50",
]
