<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weatherboy</title>
<style>
  :root {
    --bg: #efeae1; --card: #fbf8f2; --ink: #211e1a; --muted: #736b5f; --line: #ddd5c7;
    --accent: #9c3f1d; --ok: #3f7a3a; --bad: #a2322a; --paper: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1916; --card: #26231f; --ink: #eee8de; --muted: #a79e90; --line: #3a352f;
            --accent: #e08a62; --ok: #8cc47f; --bad: #f08a80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 18px 16px 6px; max-width: 1100px; margin: 0 auto; }
  h1 { font: 600 26px/1 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; margin: 0; }
  .cloud { width: 46px; height: 29px; display: block; fill: none; stroke: currentColor; stroke-width: 3.5;
           stroke-linejoin: round; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .pill { margin-left: auto; font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line);
          color: var(--muted); white-space: nowrap; }
  .pill::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px;
                  background: var(--muted); vertical-align: 0; }
  .pill.green::before { background: #3fae4a; box-shadow: 0 0 0 3px rgb(63 174 74 / .2); }
  .pill.yellow::before { background: #e3b52b; box-shadow: 0 0 0 3px rgb(227 181 43 / .22); }
  .pill.red::before { background: #d8453a; box-shadow: 0 0 0 3px rgb(216 69 58 / .22); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; padding: 12px 16px 40px;
         max-width: 1100px; margin: 0 auto; align-items: start; }
  @media (max-width: 820px) { main { grid-template-columns: minmax(0, 1fr); } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  h2 { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 0 0 12px; }
  button, .file { font: inherit; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
                  border-radius: 8px; padding: 9px 14px; cursor: pointer; }
  button:hover:not(:disabled), .file:hover { border-color: var(--muted); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--ink); color: var(--card); border-color: var(--ink); font-weight: 600; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  textarea { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
             border-radius: 8px; padding: 10px; resize: vertical; min-height: 64px; }
  form .row { margin-top: 8px; justify-content: flex-end; }
  .log { margin-top: 12px; display: grid; gap: 10px; }
  .log .q { color: var(--muted); font-size: 14px; }
  .log .a { white-space: pre-wrap; border-left: 3px solid var(--line); padding-left: 10px; }
  .log button { margin-top: 6px; font-size: 14px; padding: 5px 10px; }
  .file input { display: none; }
  label.slider { display: grid; grid-template-columns: 90px 1fr 40px; align-items: center; gap: 8px;
                 font-size: 14px; color: var(--muted); margin-top: 10px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .recipes { list-style: none; margin: 0; padding: 0; }
  .recipes li button { width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line);
                       border-radius: 0; background: none; padding: 10px 2px; }
  .recipes small { color: var(--muted); margin-left: 6px; }
  .recipes .draft { color: var(--accent); font-size: 12px; margin-left: 6px; }
  aside { position: sticky; top: 12px; }
  .paper { background: var(--paper); border-radius: 2px; box-shadow: 0 1px 4px rgb(0 0 0 / .18); min-height: 120px;
           display: grid; place-items: center; overflow: hidden;
           -webkit-mask: linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat,
                         conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom/12px 8px repeat-x;
                   mask: linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat,
                         conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom/12px 8px repeat-x; }
  .paper img { width: 100%; display: block; image-rendering: pixelated; }
  .paper .empty { color: #8a8378; font-size: 14px; padding: 40px 16px; text-align: center; }
  .actions { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  .actions button { flex: 1; }
  .msg { font-size: 14px; color: var(--muted); min-height: 1.4em; margin: 8px 0 0; }
  .msg.bad { color: var(--bad); }
  .qr { display: flex; gap: 12px; align-items: center; font-size: 14px; color: var(--muted); }
  .qr img { width: 96px; height: 96px; image-rendering: pixelated; background: #fff; border-radius: 4px; }
  .qr a { color: var(--ink); word-break: break-all; }
  .stops { margin-top: 8px; }
  .newrecipe { margin-top: 12px; }
  #recipeform { margin-top: 12px; }
  #recipetext { min-height: 320px; font: 13px/1.5 ui-monospace, Consolas, Menlo, monospace; }
  #recipeform .row { margin-top: 8px; justify-content: flex-end; }
  .model { align-items: center; margin-top: 10px; font-size: 14px; color: var(--muted); }
  select { font: inherit; font-size: 14px; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
           border-radius: 8px; padding: 6px 8px; }
  .log .cost { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .actions .icon { flex: 0 0 auto; padding: 9px 11px; line-height: 0; }
  .icon svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
  .icon[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
  .paper.editing { position: relative; touch-action: none; }
  .shade { position: absolute; left: 0; right: 0; background: rgb(30 27 23 / .55); pointer-events: none; }
  .handle { position: absolute; left: 0; right: 0; height: 28px; margin-top: -14px; cursor: ns-resize; }
  .handle::before { content: ""; position: absolute; left: 0; right: 0; top: 13px; border-top: 2px dashed var(--accent); }
  .handle span { position: absolute; right: 6px; top: 2px; font: 600 11px/1 system-ui, sans-serif; color: #fff;
                 background: var(--accent); border-radius: 4px; padding: 4px 6px; }
  .editor { margin-top: 10px; }
  .editor textarea { min-height: 160px; font-size: 14px; }
  .editor .row { margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1><svg class="cloud" viewBox="0 0 64 40" aria-hidden="true"><path d="M18 36h30a11 11 0 0 0 1.5-21.9A15 15 0 0 0 21.3 11 12.5 12.5 0 0 0 18 36z"/></svg><span class="sr">Weatherboy</span></h1>
  <span class="pill" id="status">Skriver: …</span>
</header>
<main>
  <section>
    <div class="card">
      <h2>Kvitteringer</h2>
      <div class="row">
        <button data-card="weather">Været</button>
        <button data-card="flights">Fly over oss</button>
        <button data-card="art">Dagens kunst</button>
        <button data-card="qr">QR-lapp til veggen</button>
      </div>
      <div class="row stops" id="stops"></div>
    </div>

    <div class="card">
      <h2>Spør Weatherboy</h2>
      <form id="ask">
        <textarea name="q" placeholder="Hvordan blir været i helgen? Har vi en oppskrift på fiskesuppe?"></textarea>
        <div class="row"><button class="primary">Spør</button></div>
      </form>
      <div class="row model">
        <label>Modell <select id="model"></select></label>
        <span id="spent"></span>
      </div>
      <div class="log" id="log"></div>
    </div>

    <div class="card">
      <h2>Bilde</h2>
      <label class="file">Velg eller ta et bilde<input type="file" accept="image/*" id="photo"></label>
    </div>

    <div class="card">
      <h2>Oppskrifter</h2>
      <ul class="recipes" id="recipes"><li class="msg">Henter …</li></ul>
      <div class="row newrecipe"><button id="newrecipe">+ Ny oppskrift</button></div>
      <div id="recipeform" hidden>
        <textarea id="recipetext" aria-label="Ny oppskrift" spellcheck="false"></textarea>
        <div class="row">
          <button id="recipecancel">Avbryt</button>
          <button id="recipepreview">Forhåndsvis</button>
          <button class="primary" id="recipesave">Lagre</button>
        </div>
      </div>
    </div>
  </section>

  <aside>
    <div class="card">
      <h2>Forhåndsvisning</h2>
      <div class="paper" id="paper"><p class="empty">Velg en kvittering, et spørsmål, et bilde eller en oppskrift for å se den her, prikk for prikk.</p></div>
      <label class="slider" title="Lysere gir tynnere strek på tekst, mørkere gir fetere">Lysstyrke <input type="range" id="brightness" min="0.4" max="1.8" step="0.05" value="1"><output>1.00</output></label>
      <label class="slider">Kontrast <input type="range" id="contrast" min="0.5" max="2.5" step="0.05" value="1"><output>1.00</output></label>
      <div class="actions">
        <button class="primary" id="print" disabled>Skriv ut</button>
        <button class="icon" id="edit" disabled aria-pressed="false" title="Rediger: flytt start og klipp, endre tekst" aria-label="Rediger">
          <svg viewBox="0 0 24 24"><path d="M4 20l1-5L16 4l4 4L9 19z"/><path d="M13.5 6.5l4 4"/></svg>
        </button>
      </div>
      <div class="editor" id="editor" hidden>
        <p class="msg" id="length"></p>
        <textarea id="edittext" hidden aria-label="Tekst som skrives ut"></textarea>
        <div class="row"><button id="apply" hidden>Oppdater teksten</button><button id="reset">Nullstill klipp</button></div>
      </div>
      <p class="msg" id="msg"></p>
    </div>
    <div class="card">
      <h2>Åpne på mobilen</h2>
      <div class="qr"><img src="/api/qr.png" alt="QR-kode til denne siden"><div>Skann med kameraet, eller gå til<br><a id="url"></a></div></div>
    </div>
  </aside>
</main>

<script>
const $ = s => document.querySelector(s);
let current = null;  // the request behind the preview; "Skriv ut" repeats it with print=1
let crop = null;     // {top, bottom, h} in printer dots (8 per mm): what's kept when printing
let editing = false;

function say(text, bad = false) { const m = $("#msg"); m.textContent = text; m.classList.toggle("bad", bad); }

async function receipt(path, body = null, type = null, print = false) {
  const params = new URLSearchParams();
  if (print) params.set("print", "1");
  for (const k of ["brightness", "contrast"]) if ($("#" + k).value !== "1") params.set(k, $("#" + k).value);
  if (print && crop && (crop.top > 0 || crop.bottom < crop.h)) { params.set("top", crop.top); params.set("bottom", crop.bottom); }
  const url = params.size ? path + (path.includes("?") ? "&" : "?") + params : path;
  const r = await fetch(url, { method: "POST", body, headers: type ? { "Content-Type": type } : {} });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return URL.createObjectURL(await r.blob());
}

// current.q / current.a are set for Claude's answers: those are the ones with editable text
async function preview(path, body = null, type = null, extra = {}) {
  current = { path, body, type, ...extra };
  $("#print").disabled = $("#edit").disabled = true;
  say("Lager forhåndsvisning …");
  try {
    const src = await receipt(path, body, type);
    if (current?.path !== path || current.body !== body) return;  // a newer preview won
    const img = Object.assign(new Image(), { src, alt: "Forhåndsvisning av kvitteringen" });
    await img.decode();
    $("#paper").innerHTML = "";
    $("#paper").append(img);
    crop = { top: 0, bottom: img.naturalHeight, h: img.naturalHeight };
    $("#print").disabled = $("#edit").disabled = false;
    say("");
    showEditor();
    if (matchMedia("(max-width: 820px)").matches) $("#paper").scrollIntoView({ behavior: "smooth", block: "start" });
  } catch (e) { say(e.message, true); }
}

$("#print").onclick = async () => {
  $("#print").disabled = true;
  say("Skriver ut …");
  try { await receipt(current.path, current.body, current.type, true); say("Skrevet ut ✓"); }
  catch (e) { say(e.message, true); }
  $("#print").disabled = false;
  refreshStatus();
};

// Editing: two draggable lines on the preview (start, and where the cutter cuts), and the text of Claude's answers.
$("#edit").onclick = () => { editing = !editing; showEditor(); };

function showEditor() {
  $("#edit").setAttribute("aria-pressed", editing);
  $("#editor").hidden = !editing || !crop;
  const paper = $("#paper");
  paper.classList.toggle("editing", editing && !!crop);
  paper.querySelectorAll(".shade, .handle").forEach(el => el.remove());
  const isText = current?.a !== undefined;
  $("#edittext").hidden = $("#apply").hidden = !isText;
  if (isText && $("#edittext").dataset.for !== current.a) { $("#edittext").value = current.a; $("#edittext").dataset.for = current.a; }
  if (!editing || !crop) return;
  const shadeTop = Object.assign(document.createElement("div"), { className: "shade" });
  const shadeBottom = Object.assign(document.createElement("div"), { className: "shade" });
  const start = handle("start"), cut = handle("✂ klipp her");
  paper.append(shadeTop, shadeBottom, start, cut);
  const scale = () => paper.querySelector("img").clientHeight / crop.h;  // screen px per printer dot
  function place() {
    const s = scale();
    start.style.top = crop.top * s + "px";
    cut.style.top = crop.bottom * s + "px";
    Object.assign(shadeTop.style, { top: 0, height: crop.top * s + "px" });
    Object.assign(shadeBottom.style, { top: crop.bottom * s + "px", bottom: 0 });
    $("#length").textContent = `Papir: ${Math.round((crop.bottom - crop.top) / 8)} mm (pluss ca. 15 mm fram til kutteren). Dra linjene for å flytte start og klipp.`;
  }
  drag(start, y => { crop.top = Math.max(0, Math.min(y / scale(), crop.bottom - 40)); place(); });
  drag(cut, y => { crop.bottom = Math.min(crop.h, Math.max(y / scale(), crop.top + 40)); place(); });
  place();
}

function handle(label) {
  const h = Object.assign(document.createElement("div"), { className: "handle" });
  h.append(Object.assign(document.createElement("span"), { textContent: label }));
  return h;
}

function drag(el, move) {  // pointer events: mouse and touch alike
  el.onpointerdown = ev => {
    el.setPointerCapture(ev.pointerId);
    const top = $("#paper").getBoundingClientRect().top;
    el.onpointermove = e => move(e.clientY - top);
    el.onpointerup = () => { el.onpointermove = null; crop.top = Math.round(crop.top); crop.bottom = Math.round(crop.bottom); };
  };
}

$("#reset").onclick = () => { if (crop) { crop.top = 0; crop.bottom = crop.h; showEditor(); } };
$("#apply").onclick = () => {
  const a = $("#edittext").value;
  const { q, icon } = current;
  preview("/api/answer", JSON.stringify({ q, a, icon }), "application/json", { q, a, icon });
};
addEventListener("resize", () => editing && showEditor());

document.querySelectorAll("[data-card]").forEach(b => b.onclick = () => preview("/api/card/" + b.dataset.card));

$("#ask").onsubmit = async ev => {
  ev.preventDefault();
  const q = ev.target.q.value.trim(), btn = ev.target.querySelector("button");
  if (!q) return;
  btn.disabled = true; btn.textContent = "Tenker …";
  const entry = document.createElement("div");
  entry.innerHTML = `<div class="q"></div><div class="a">…</div>`;
  entry.querySelector(".q").textContent = q;
  $("#log").prepend(entry);
  try {
    const r = await fetch("/api/ask", { method: "POST", body: JSON.stringify({ q }), headers: { "Content-Type": "application/json" } });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    entry.querySelector(".a").textContent = d.answer;
    entry.append(Object.assign(document.createElement("div"), { className: "cost", textContent: `≈ $${d.cost.toFixed(4)} · ${d.model}` }));
    showSpent(d.spent);
    const again = Object.assign(document.createElement("button"), { textContent: d.recipe ? "Vis oppskriften" : "Vis kvittering" });
    // a recipe the answer read or drafted prints as its card, even if the model only described it
    const show = d.recipe && !/^## (Ingredienser|Ingredients)\s*$/im.test(d.answer)
      ? () => preview("/api/recipe?name=" + encodeURIComponent(d.recipe))
      : () => preview("/api/answer", JSON.stringify({ q, a: d.answer, icon: d.icon }), "application/json",
                      { q, a: d.answer, icon: d.icon });
    if (d.recipe) loadRecipes();
    again.onclick = show;
    entry.append(again);
    ev.target.q.value = "";
    show();
  } catch (e) { entry.querySelector(".a").textContent = "Feil: " + e.message; }
  btn.disabled = false; btn.textContent = "Spør";
};
$("#ask textarea").onkeydown = ev => { if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) $("#ask").requestSubmit(); };

$("#photo").onchange = ev => {
  const file = ev.target.files[0];
  if (file) preview("/api/photo", file, file.type || "application/octet-stream");
};

// Brightness and contrast apply to every print: re-render whatever is previewed as the sliders move
let timer = null;
for (const s of ["#brightness", "#contrast"]) {
  $(s).oninput = ev => {
    ev.target.nextElementSibling.textContent = Number(ev.target.value).toFixed(2);
    clearTimeout(timer);
    timer = setTimeout(() => current && preview(current.path, current.body, current.type, current), 350);
  };
}

async function loadRecipes() {
  const list = $("#recipes");
  try {
    const rs = await (await fetch("/api/recipes")).json();
    list.innerHTML = rs.length ? "" : '<li class="msg">Ingen oppskrifter ennå.</li>';
    for (const r of rs) {
      const li = document.createElement("li"), b = document.createElement("button");
      b.textContent = r.title;
      if (r.tags) b.append(Object.assign(document.createElement("small"), { textContent: r.tags }));
      if (r.draft) b.append(Object.assign(document.createElement("span"), { className: "draft", textContent: "utkast" }));
      b.onclick = () => preview("/api/recipe?name=" + encodeURIComponent(r.name));
      li.append(b); list.append(li);
    }
  } catch { list.innerHTML = '<li class="msg">Fant ikke oppskriftene.</li>'; }
}

async function refreshStatus() {
  const p = $("#status");
  try {
    const s = await (await fetch("/api/status")).json();
    p.textContent = "Skriver: " + s.state; p.className = "pill " + s.level;
  } catch { p.textContent = "Serveren svarer ikke"; p.className = "pill red"; }
}
// New recipe: the template (recipes/_mal.md) in a text box; preview renders it as the printed card
$("#newrecipe").onclick = async () => {
  if (!$("#recipetext").value) $("#recipetext").value = (await (await fetch("/api/recipe-template")).json()).markdown;
  $("#recipeform").hidden = false; $("#newrecipe").hidden = true;
  $("#recipetext").focus();
};
$("#recipecancel").onclick = () => { $("#recipeform").hidden = true; $("#newrecipe").hidden = false; };
$("#recipepreview").onclick = () =>
  preview("/api/answer", JSON.stringify({ q: "", a: $("#recipetext").value }), "application/json");
$("#recipesave").onclick = async () => {
  const r = await fetch("/api/recipes", { method: "POST", body: JSON.stringify({ markdown: $("#recipetext").value }),
                                          headers: { "Content-Type": "application/json" } });
  const d = await r.json();
  if (!r.ok) return say(d.error, true);
  $("#recipetext").value = ""; $("#recipeform").hidden = true; $("#newrecipe").hidden = false;
  await loadRecipes();
  await preview("/api/recipe?name=" + encodeURIComponent(d.name));
  say(`Lagret som ${d.name}.md i oppskriftene.`);
};

function showSpent(dollars) { $("#spent").textContent = `brukt ≈ $${dollars.toFixed(4)} siden oppstart`; }

async function loadModels() {
  const d = await (await fetch("/api/models")).json();
  const sel = $("#model");
  for (const m of d.models) {
    sel.append(Object.assign(document.createElement("option"), {
      value: m.id, selected: m.id === d.model, textContent: `${m.name}: $${m.price[0]} / $${m.price[1]} per mill. tokens` }));
  }
  showSpent(d.spent);
  sel.onchange = async () => {
    const r = await fetch("/api/model", { method: "POST", body: JSON.stringify({ model: sel.value }), headers: { "Content-Type": "application/json" } });
    say(r.ok ? "Byttet modell. Ny samtale starter." : "Kunne ikke bytte modell.", !r.ok);
  };
}

const MODES = { rail: "Tog fra", bus: "Buss fra", tram: "Trikk fra", metro: "T-bane fra", water: "Båt fra" };
async function loadStops() {
  const stops = await (await fetch("/api/stops")).json();
  stops.forEach((s, i) => {
    const b = Object.assign(document.createElement("button"), {
      textContent: s.mode ? `${MODES[s.mode] || s.mode} ${s.name}` : `Avganger ${s.name}` });
    b.onclick = () => preview("/api/card/departures?stop=" + i);
    $("#stops").append(b);
  });
}

refreshStatus(); setInterval(refreshStatus, 10000);
loadModels();
loadStops();
fetch("/api/url").then(r => r.json()).then(d => { const a = $("#url"); a.href = a.textContent = d.url; });
loadRecipes();
</script>
</body>
</html>
